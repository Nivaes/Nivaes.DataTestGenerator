name: Publish Release

on:
  release:
    types:
      - released
      - prereleased

permissions:
  contents: read

jobs:
  publish_release:
    runs-on: ubuntu-latest

    steps:
    - name: Dump GitHub context
      env:
        GITHUB_CONTEXT: ${{ toJson(github) }}
      run: echo "$GITHUB_CONTEXT"

    - name: release
      if: github.event.action == 'released'
      run: echo Release

    - name: prereleased
      if: github.event.action == 'prereleased'
      run: echo Prereleased

    - name: Release
      run: |
        echo "Tag: ${{ github.event.release.ref }}"

    - name: Get Version
      if: github.event.action == 'prereleased
      uses: nivaes/version-pack@develop
      id: version_pack
      with:
        package-flow: Preview

    - name: Get Version
      if: github.event.action == 'released
      uses: nivaes/version-pack@develop
      id: version_pack
      with:
        package-flow: Release

    - name: Restore Dependencies
      run: |
          dotnet restore

    - name: Build
      run: dotnet build --configuration Release -p:Version=${{ steps.version_pack.outputs.version-pack }} --no-restore

    - name: Test
      run: dotnet test --configuration Release --no-build --verbosity normal --no-restore --no-build

    - name: Pack
      if: github.event_name == 'push' || (github.event_name != 'pull_request')
      run: dotnet pack --configuration Release --no-build --verbosity normal --output ./Artifacts/ -p:Version=${{ steps.version_pack.outputs.version-pack }} --no-restore --no-build

    - name: Update release
      uses: nivaes/update-release@develop  
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      with:
         files: |
          ./Artifacts/*.{nupkg,snupkg}

